# Cosine Gaming static site — games.cosine.website
#
# Build and deploy:
#   .venv/bin/python build.py
#   rsync -av --delete site/ /var/www/cosine-gaming/
#
# Install:
#   sudo cp deploy/nginx/games.cosine.website.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/games.cosine.website.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (after DNS points here):
#   sudo certbot --nginx -d games.cosine.website

server {
	listen 80;
	listen [::]:80;
	server_name games.cosine.website;

	root /var/www/cosine-gaming;
	index index.html;

	charset utf-8;

	gzip on;
	gzip_types text/css application/javascript image/svg+xml;

	# Redirects (match site/_redirects from build.py)
	location = /                  { return 301 /games/; }
	location = /games             { return 301 /games/; }
	location = /index.html        { return 301 /games/; }
	location = /pale-white-dot    { return 301 /pale-white-dot/; }
	location = /blog/page/1       { return 301 /blog/; }
	location = /blog/page/1/      { return 301 /blog/; }

	# /games/, /flip/, /blog/post/53/, etc.
	location / {
		expires epoch;
		try_files $uri $uri/ $uri/index.html =404;
	}

	location /static/ {
		expires 30d;
		add_header Cache-Control "public";
		try_files $uri =404;
	}

	# Ruffle WebAssembly (required for Flash games)
	location ~* \.wasm$ {
		default_type application/wasm;
		expires 30d;
		add_header Cache-Control "public";
	}

	error_page 404 /404.html;
}

# certbot --nginx will add HTTPS, or duplicate the block above on :443 with:
#
#   ssl_certificate     /etc/letsencrypt/live/games.cosine.website/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/games.cosine.website/privkey.pem;
#   include /etc/letsencrypt/options-ssl-nginx.conf;
#   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
